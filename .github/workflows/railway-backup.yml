name: Firebase Firestore Backup

on:
  schedule:
    # Ejecutar diariamente a las 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite ejecución manual desde GitHub UI

permissions:
  contents: write

env:
  RETENTION_DAYS: 14
  BACKUP_BRANCH: backups

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup backup branch
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Crear o cambiar a la rama de backups
          if git ls-remote --heads origin ${{ env.BACKUP_BRANCH }} | grep -q ${{ env.BACKUP_BRANCH }}; then
            git fetch origin ${{ env.BACKUP_BRANCH }}
            git checkout ${{ env.BACKUP_BRANCH }}
            # Traer el script de backup de main
            git checkout main -- scripts/firebase-backup.mjs package.json
          else
            git checkout --orphan ${{ env.BACKUP_BRANCH }}
            git rm -rf . || true
            git checkout main -- scripts/firebase-backup.mjs package.json
            echo "# Firebase Backups" > README.md
            echo "" >> README.md
            echo "Este branch contiene backups automáticos de Firestore." >> README.md
            echo "" >> README.md
            echo "## Estructura" >> README.md
            echo "- \`backup_YYYY-MM-DD_HH-MM-SS_UTC_firestore.json.gz\` - Datos de Firestore" >> README.md
            git add README.md
            git commit -m "Initialize backups branch"
            git push -u origin ${{ env.BACKUP_BRANCH }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Generate timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S_UTC")
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "Timestamp: ${TIMESTAMP}"

      - name: Check FIREBASE_SERVICE_ACCOUNT_KEY is configured
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_KEY}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_KEY secret is not configured!"
            echo ""
            echo "To generate a service account key:"
            echo "  1. Go to Firebase Console → Project Settings → Service Accounts"
            echo "  2. Click 'Generate new private key'"
            echo "  3. Copy the entire JSON content"
            echo "  4. Add it as FIREBASE_SERVICE_ACCOUNT_KEY in GitHub Secrets"
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT_KEY is configured ✓"

      - name: Create Firestore backup
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          BACKUP_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        run: node scripts/firebase-backup.mjs

      - name: Rotate old backups (>14 days)
        run: |
          echo "Checking for backups older than ${{ env.RETENTION_DAYS }} days..."

          CURRENT_DATE=$(date +%s)
          DELETED=0

          for file in backup_*.json.gz; do
            if [ -f "$file" ]; then
              # Extraer fecha del nombre (formato: backup_YYYY-MM-DD_...)
              FILE_DATE=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)

              if [ -n "$FILE_DATE" ]; then
                FILE_EPOCH=$(date -d "$FILE_DATE" +%s)
                AGE_DAYS=$(( (CURRENT_DATE - FILE_EPOCH) / 86400 ))

                if [ "$AGE_DAYS" -gt "${{ env.RETENTION_DAYS }}" ]; then
                  echo "Deleting: $file (${AGE_DAYS} days old)"
                  git rm "$file" 2>/dev/null || rm "$file"
                  DELETED=$((DELETED + 1))
                fi
              fi
            fi
          done

          echo "Deleted $DELETED old backup files"

      - name: Commit and push backup
        run: |
          BACKUP_NAME="backup_${{ steps.timestamp.outputs.timestamp }}"

          # Limpiar archivos temporales de npm
          rm -rf node_modules package.json package-lock.json scripts 2>/dev/null || true

          git add "${BACKUP_NAME}_firestore.json.gz" || true
          git add -A  # Include any deleted files from rotation

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Backup: ${{ steps.timestamp.outputs.timestamp }}"
            git push origin ${{ env.BACKUP_BRANCH }}
          fi

      - name: Backup summary
        run: |
          echo "=========================================="
          echo "Backup completed successfully!"
          echo "=========================================="
          echo ""
          echo "Timestamp: ${{ steps.timestamp.outputs.timestamp }}"
          echo "Branch: ${{ env.BACKUP_BRANCH }}"
          echo ""
          echo "File created:"
          echo "  - backup_${{ steps.timestamp.outputs.timestamp }}_firestore.json.gz"
          echo ""
          echo "To restore, see scripts/firebase-restore.mjs"
          echo "=========================================="
